name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lunchbox
          POSTGRES_PASSWORD: lunchbox
          POSTGRES_DB: lunchbox
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lunchbox -d lunchbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lunchbox:lunchbox@localhost:5433/lunchbox?schema=public
      BETTER_AUTH_SECRET: ci-secret-change-me-in-production-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - name: Use Node LTS (production target)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma migrate deploy
        run: npm run -w @lunchbox/db migrate:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
