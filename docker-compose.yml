services:
  db:
    image: postgres:18
    container_name: lunchbox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lunchbox
      POSTGRES_PASSWORD: lunchbox
      POSTGRES_DB: lunchbox
    ports:
      - "5433:5432"
    volumes:
      - lunchbox-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchbox -d lunchbox"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Local SMTP catcher — captures all outbound email, nothing leaves your machine.
  # Web UI: http://localhost:8025 — SMTP endpoint: localhost:1025
  mail:
    image: axllent/mailpit:latest
    container_name: lunchbox-mail
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  lunchbox-db-data:
